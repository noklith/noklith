name: API checks

# Every change to main and every pull request into it runs the checks; nothing is published or deployed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout the full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (checksum pinned)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan every commit for secrets
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        # Same major version as production (deploy/compose.yaml).
        image: postgres:18.3
        env:
          POSTGRES_DB: crypto_card_ci_test
          POSTGRES_USER: crypto_card_ci
          POSTGRES_PASSWORD: ephemeral_ci_database_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crypto_card_ci -d crypto_card_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_POSTGRES_URL: postgresql://crypto_card_ci:ephemeral_ci_database_only@127.0.0.1:5432/crypto_card_ci_test
    defaults:
      run:
        working-directory: apps/api
        shell: bash
    steps:
      - name: Checkout private sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14.1'
      - name: Install exact locked packages without lifecycle scripts
        run: npm ci --ignore-scripts --no-fund
      - name: Fail on known vulnerabilities in runtime dependencies
        run: npm audit --omit=dev --audit-level=low
      - name: Report advisories in development dependencies
        run: npm audit --audit-level=high
      - name: Check TypeScript
        run: npm run check
      - name: Run API, authentication, money and RPC tests
        run: |
          set -o pipefail
          mkdir -p ../../build/api-evidence
          node --version > ../../build/api-evidence/node-version.txt
          node --input-type=module -e 'import pg from "pg"; import {writeFileSync} from "node:fs"; const pool=new pg.Pool({connectionString:process.env.TEST_POSTGRES_URL}); try {writeFileSync("../../build/api-evidence/postgres-version.txt",(await pool.query("SHOW server_version")).rows[0].server_version+"\n");} finally {await pool.end();}'
          node --test --test-concurrency=1 --test-reporter=tap test/*.test.ts | tee ../../build/api-evidence/tests.tap
      - name: Exercise a real loopback fixture HTTP listener
        run: |
          set -o pipefail
          npm run smoke:fixture | tee ../../build/api-evidence/http-smoke.log
      - name: Record passing run and source
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync("../../build/api-evidence/manifest.json", JSON.stringify({commit:process.env.SOURCE_COMMIT,run_url:process.env.RUN_URL,node:process.version,checks:["typecheck","all-unit-and-route-tests","postgres-multiple-connections","fixture-tcp-smoke"],database:"PGlite plus isolated PostgreSQL 18.3 service",rpc:"mock only",wallet:"ephemeral test keys only"},null,2));'
      - name: Upload compact test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/api-evidence/
          if-no-files-found: warn
          retention-days: 3
