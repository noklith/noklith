services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_DB: crypto_card
      POSTGRES_USER: crypto_card
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto_card -d crypto_card"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
